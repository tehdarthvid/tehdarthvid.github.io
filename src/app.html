<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			GitHub Pages can't set response headers, so the CSP is the only security header here.
			HSTS, nosniff, Referrer-Policy etc. are ignored by browsers as <meta>, so they aren't set.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self' fonts.gstatic.com www.youtube.com; script-src 'self' 'unsafe-inline' www.googletagmanager.com www.google-analytics.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com fonts.gstatic.com; img-src 'self' *; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self' *; object-src 'none'; base-uri 'self'; form-action 'self';"
		/>

		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
