<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			The CSP is set in vite.config.js (sveltekit({ csp })), not here. SvelteKit writes it as a
			<meta http-equiv> with hashes of its own inline scripts, at the start of the head
			placeholder below, so the favicon comes after it to be covered too. GitHub Pages can't set
			response headers, so it's the only security header; HSTS, nosniff, Referrer-Policy etc. are
			ignored by browsers as <meta>, so they aren't set.
		-->
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
