name: GitHub Pages Deploy

# Requires:
#   - repo secret PUBLIC_GA_TRACKING_ID: Google Analytics measurement ID (optional for
#     the build; the check-ga job warns and opens an issue if the live site lacks it)
#   - Settings > Pages > Source set to "GitHub Actions"
on:
  push:
    branches:
      - dev
      - main
      - claude-experiments
    paths:
      - '**'
      - '!README.md'
      - '!CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_GA_TRACKING_ID: ${{ secrets.PUBLIC_GA_TRACKING_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium
        timeout-minutes: 5

      # Playwright's webServer runs `npm run build`, so build/ is produced here and is what gets deployed.
      - name: Build and test
        run: |
          export PUBLIC_GITHUB_SHA=$GITHUB_SHA
          npm run test

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    # Only dev and main go live; other branches just build and test.
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  check-ga:
    # Never fails the run for missing GA: warns, and tracks it in one open issue
    # that closes itself once GA is back.
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: GA missing on live site
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
      GA_ID: ${{ secrets.PUBLIC_GA_TRACKING_ID }}
    steps:
      - name: Check live page for GA tag
        run: |
          short="${GITHUB_SHA::7}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$SITE_URL" ]; then
            echo "::warning::No site URL from the deploy job; skipped the GA check"
            exit 0
          fi

          # The CDN can serve the previous build for a while, so wait until the
          # page shows this commit (up to ~10 min). The query string busts caches.
          page=''
          for i in $(seq 1 20); do
            page="$(curl -fsSL --max-time 20 "${SITE_URL%/}/?ga-check=$GITHUB_RUN_ID-$i" || true)"
            grep -qF "$short" <<<"$page" && break
            page=''
            sleep 30
          done
          if [ -z "$page" ]; then
            echo "::warning::$SITE_URL never showed build $short; skipped the GA check"
            exit 0
          fi

          issue="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')"

          if [ -n "$GA_ID" ] && grep -qF "googletagmanager.com/gtag/js?id=$GA_ID" <<<"$page"; then
            echo "GA tag present on $SITE_URL (build $short)"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "GA is back on $SITE_URL as of $GITHUB_SHA ($run_url)."
            fi
            exit 0
          fi

          echo "::warning::GA tag missing on $SITE_URL (build $short)"
          body="The GA tag is missing on $SITE_URL after deploying $GITHUB_SHA ($run_url)."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Still missing. $body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"$'\n\n'"Check that the GA ID repo secret is set and that the build reads it. This issue closes itself once a deploy has GA again."
          fi
