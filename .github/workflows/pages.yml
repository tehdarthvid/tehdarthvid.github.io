name: GitHub Pages Deploy

# Requires:
#   - repo secret PUBLIC_GA_TRACKING_ID: Google Analytics measurement ID
#   - Settings > Pages > Source set to "GitHub Actions"
on:
  push:
    branches:
      - dev
      - main
      - claude-experiments
    paths:
      - '**'
      - '!README.md'
      - '!CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_GA_TRACKING_ID: ${{ secrets.PUBLIC_GA_TRACKING_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps
        timeout-minutes: 5

      # Playwright's webServer runs `npm run build`, so build/ is produced here and is what gets deployed.
      - name: Build and test
        run: |
          export PUBLIC_GITHUB_SHA=$GITHUB_SHA
          npm run test

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    # Only dev and main go live; other branches just build and test.
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
